name: Test DocuDesk mobile scanner prototype

on:
  push:
    branches:
      - mobile-scan-test
    paths:
      - "local_bridge.py"
      - "docs/index.html"
      - ".github/workflows/test-mobile-scan.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile local_bridge.py
      - name: Check prototype hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("docs/index.html").read_text(encoding="utf-8")
          bridge = Path("local_bridge.py").read_text(encoding="utf-8")
          required_html = ["phone-scan-start", "pollPhoneScan", "QRCode"]
          required_bridge = ["MOBILE_PAGE", "/mobile/start", "/mobile/upload", "/mobile/poll"]
          assert all(value in html for value in required_html)
          assert all(value in bridge for value in required_bridge)
          print("Mobile scanner prototype hooks found.")
          PY
