name: Build DocuDesk for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[windows,dev]"

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir `
            --name DocuDesk `
            --paths src `
            --collect-all fitz `
            --collect-all pymupdf `
            --collect-all PySide6 `
            --collect-all PIL `
            --hidden-import win32com.client `
            --hidden-import pythoncom `
            --hidden-import pywintypes `
            run_docudesk.py
          if (!(Test-Path "dist/DocuDesk/DocuDesk.exe")) {
            throw "DocuDesk.exe was not created"
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/DocuDesk" -DestinationPath "dist/DocuDesk-Portable-Windows-x64.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc "DocuDesk.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          if (!(Test-Path "installer/DocuDesk-Setup.exe")) { throw "Installer was not created" }

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: DocuDesk-Windows-builds
          path: |
            dist/DocuDesk-Portable-Windows-x64.zip
            installer/DocuDesk-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DocuDesk-Portable-Windows-x64.zip
            installer/DocuDesk-Setup.exe
          generate_release_notes: true
