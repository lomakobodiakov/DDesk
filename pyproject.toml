[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docudesk"
version = "0.1.0"
description = "Offline desktop document tools for Windows"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7", "PyMuPDF>=1.24", "Pillow>=10.0"]

[project.optional-dependencies]
windows = ["pywin32>=306"]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
docudesk = "docudesk.main:main"

[tool.setuptools.packages.find]
where = ["src"]
